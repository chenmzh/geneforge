name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Lint
        working-directory: backend
        run: python -m ruff check app scripts tests

      - name: Tests
        working-directory: backend
        run: python -m pytest -q

      - name: Migration matches the models
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./ci-migration-check.db
          SECRET_KEY: ci-only-not-a-real-secret
        run: |
          python -m alembic upgrade head
          python -m alembic downgrade base
          python -m alembic upgrade head
          # autogenerate must produce an empty diff against the migrated schema
          python - <<'PY'
          from alembic.autogenerate import compare_metadata
          from alembic.migration import MigrationContext
          from app.db.base import Base
          from app.db.session import engine
          from app import models  # noqa: F401

          with engine.connect() as connection:
              diff = compare_metadata(MigrationContext.configure(connection), Base.metadata)
          drift = [d for d in diff if "alembic_version" not in str(d)]
          if drift:
              raise SystemExit(f"schema drift between models and migrations: {drift}")
          print("no schema drift")
          PY

  frontend:
    name: frontend (tsc + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # pnpm 10 exits non-zero when a dependency build script is not approved
      # (esbuild ships one), so verify the toolchain instead of the exit code.
      - name: Install dependencies
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile || pnpm install || true
          test -x node_modules/.bin/vite
          test -x node_modules/.bin/tsc

      - name: Type-check
        working-directory: frontend
        run: ./node_modules/.bin/tsc --noEmit

      - name: Build
        working-directory: frontend
        run: ./node_modules/.bin/vite build

      - uses: actions/upload-artifact@v7
        with:
          name: spa-dist
          path: backend/app/static
          retention-days: 7

  docker:
    name: docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: geneforge:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the container
        run: |
          docker run -d --name gf-ci -p 8000:8000 \
            -e SECRET_KEY=ci-only-not-a-real-secret \
            -e DATABASE_URL=sqlite:////app/backend/storage/ci.db \
            -e FIRST_SUPERUSER_PASSWORD=CiPassword123 \
            geneforge:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/v1/health >/dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/api/v1/health
          curl -fsS http://127.0.0.1:8000/ | grep -q "GeneForge"
          TOKEN=$(curl -fsS -X POST http://127.0.0.1:8000/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"admin@geneforge.local","password":"CiPassword123"}' \
            | python3 -c 'import sys,json;print(json.load(sys.stdin)["access_token"])')
          curl -fsS -X POST http://127.0.0.1:8000/api/v1/tools/digest \
            -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d '{"sequence":"GAATTCAAAAAAAAAAGGATCC","enzymes":["EcoRI","BamHI"]}' \
            | python3 -c 'import sys,json;d=json.load(sys.stdin);assert d["fragment_sizes"],"no fragments";print("digest ok:",d["fragment_sizes"])'
          docker logs gf-ci | tail -20
          docker rm -f gf-ci
