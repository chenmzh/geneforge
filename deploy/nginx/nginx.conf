# GeneForge reverse proxy: serves the SPA + API from one origin.
upstream geneforge_api {
    server api:8000;
    keepalive 16;
}

# Uploads of GenBank/FASTA files can be large; keep this in step with
# MAX_UPLOAD_BYTES on the API (default 64 MiB).
client_max_body_size 64m;

server {
    listen 80;
    server_name _;

    # security headers (the API sets its own too)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # long-lived, content-hashed assets
    location /assets/ {
        proxy_pass http://geneforge_api;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API + docs: no caching, longer timeouts for big analyses
    location ~ ^/(api|docs|redoc|openapi.json) {
        proxy_pass http://geneforge_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    # SPA (FastAPI serves index.html and falls back for client routes)
    location / {
        proxy_pass http://geneforge_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
